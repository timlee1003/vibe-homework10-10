<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？｜美食扭蛋機</title>
<style>
:root{--red:#d94e58;--brown:#51352b;--cream:#fff8ef;--line:#e9cdb8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 10%,#fff9e9,#f5e1d0 65%,#efd3c2);color:var(--brown);font-family:DFKai-SB,"BiauKai","標楷體",serif;min-height:100vh}.en{font-family:"Times New Roman",Times,serif}header{text-align:center;padding:34px 12px 14px}h1{font-size:clamp(34px,5vw,58px);margin:0;font-weight:bold}header p{font-size:19px;margin:4px 0}.wrap{max-width:1190px;margin:auto;padding:12px 22px 50px;display:grid;grid-template-columns:410px 1fr;gap:30px;align-items:start}.machine-area{text-align:center}.machine{width:100%;max-width:390px;margin:10px auto;filter:drop-shadow(0 13px 12px #9a5e4b44)}.cap{height:65px;width:85%;margin:auto;background:linear-gradient(#ff8e86,#d8383f);border:7px solid #c83b43;border-radius:65% 65% 14px 14px;position:relative;z-index:2}.globe{height:340px;margin:-7px auto -8px;width:96%;border:9px solid #d9aca0;border-radius:46% 46% 25% 25%;background:linear-gradient(110deg,#ffffffb5,#ffffff35 45%,#fff8e8a6);position:relative;overflow:hidden;box-shadow:inset 17px 5px 23px #fff9}.balls{position:absolute;bottom:4px;left:5%;width:90%;height:80%;display:flex;flex-wrap:wrap;align-content:end;justify-content:center;gap:0}.ball{width:83px;height:83px;border-radius:50%;border:4px solid #ffffff88;box-shadow:inset -11px -12px 10px #0002,inset 9px 10px 10px #fff9,0 3px 5px #0002;display:grid;place-items:center;font-size:38px;margin:-7px -3px;transform:rotate(var(--r))}.base{height:185px;background:linear-gradient(100deg,#b72c34,#f35b56 38%,#ce303d);border:7px solid #b92c35;border-radius:32px 32px 50px 50px;position:relative;box-shadow:inset 8px 8px 15px #ffffff44}.dial{position:absolute;top:19px;left:50%;transform:translateX(-50%);height:100px;width:100px;border-radius:50%;border:9px solid #a8a4a1;background:linear-gradient(130deg,#fff,#9e9a97);box-shadow:0 4px 3px #0004}.dial:after{content:"";display:block;position:absolute;top:37px;left:11px;width:65px;height:18px;background:#6f6965;border:3px solid #e6e1db;border-radius:10px;transform:rotate(-38deg)}.slot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:130px;height:47px;border-radius:55px 55px 8px 8px;background:#742126;border:6px solid #e97066}.side-note{font-size:17px;margin:18px auto;color:#80594c}.panel{background:#fffaf3c9;border:2px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 12px 30px #a7674721}.panel h2{text-align:center;margin:0 0 18px;font-size:27px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.food{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #efd7c2;border-radius:15px;padding:10px;font-size:20px;box-shadow:0 3px 6px #bd88651c}.food .num{background:#e78d89;color:white;width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font:18px 'Times New Roman',serif}.food .emoji{font-size:30px}.result-section{margin-top:24px}.result-title{font-size:25px;text-align:center;background:#d95766;color:white;border-radius:16px;padding:12px;margin:0 0 15px}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{background:#fff;border:2px solid #e5c7b2;border-radius:20px;min-height:170px;text-align:center;padding:12px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.result:nth-child(1){background:#fff3ce;border-color:#e9bf60}.result:nth-child(2){background:#edf0fa;border-color:#b6c6df}.result:nth-child(3){background:#ffece5;border-color:#e5b09d}.rank{font-size:18px}.result .icon{font-size:47px}.result strong{font-size:23px}.result small{font:16px 'Times New Roman',serif}button{display:block;margin:20px auto 0;background:linear-gradient(#ed7580,#ce4356);color:white;border:0;border-radius:40px;font:26px DFKai-SB,"BiauKai","標楷體",serif;padding:15px 44px;cursor:pointer;box-shadow:0 6px 0 #a83644;transition:transform .15s}button:hover{filter:brightness(1.07)}button:active{transform:translateY(4px);box-shadow:0 2px 0 #a83644}button:disabled{opacity:.65;cursor:wait}.tip{text-align:center;font-size:16px;line-height:1.7;color:#89685c}.shake{animation:shake .6s ease-in-out}@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(3deg)}}.pop{animation:pop .5s ease both}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}footer{text-align:center;padding:0 10px 24px;color:#8e6a5e;font:15px 'Times New Roman',serif}@media(max-width:850px){.wrap{grid-template-columns:1fr;max-width:620px}.machine-area{max-width:360px;margin:auto}.globe{height:300px}.base{height:165px}}@media(max-width:440px){.wrap{padding:8px 12px 30px}.panel{padding:16px 12px}.food{font-size:17px;gap:6px;padding:8px 5px}.food .emoji{font-size:25px}.results{gap:5px}.result{padding:8px 2px;min-height:145px}.result .icon{font-size:34px}.result strong{font-size:18px}.rank{font-size:15px}.result small{font-size:13px}}
</style>
</head>
<body>
<header><h1>🍽️ 今天吃什麼？</h1><p class="en">WHAT TO EAT TODAY?</p><p>選擇困難救星・美食扭蛋機</p></header>
<main class="wrap">
<section class="machine-area" aria-label="美食扭蛋機"><div class="machine" id="machine"><div class="cap"></div><div class="globe"><div class="balls" id="balls"></div></div><div class="base"><div class="dial"></div><div class="slot"></div></div></div><p class="side-note">🎁 每次隨機抽出三種不同的美食！</p></section>
<section class="panel"><h2>✨ 扭蛋選項（共 10 種）</h2><div class="menu" id="menu"></div><section class="result-section"><h2 class="result-title" id="status">🎉 本次抽出的 3 名幸運美食！</h2><div class="results" id="results" aria-live="polite"></div><button id="draw" type="button">🎲 再抽一次</button><p class="tip">不知道要吃什麼嗎？按下按鈕，讓扭蛋機幫你決定！<br>每次抽出 3 種不同餐點，沒有重複。</p></section></section>
</main><footer>FOOD GACHA MACHINE · Made with HTML, CSS &amp; JavaScript</footer>
<script>
const foods=[{zh:'滷肉飯',en:'Braised Pork Rice',icon:'🍚'},{zh:'拉麵',en:'Ramen',icon:'🍜'},{zh:'火鍋',en:'Hot Pot',icon:'🍲'},{zh:'壽司',en:'Sushi',icon:'🍣'},{zh:'炸雞',en:'Fried Chicken',icon:'🍗'},{zh:'義大利麵',en:'Pasta',icon:'🍝'},{zh:'漢堡',en:'Burger',icon:'🍔'},{zh:'韓式拌飯',en:'Bibimbap',icon:'🥘'},{zh:'健康餐',en:'Healthy Bowl',icon:'🥗'},{zh:'越南河粉',en:'Pho',icon:'🥣'}];
const colors=['#f4b0bd','#8bcce5','#f8d370','#a9dba9','#c8a9e7','#f5a975'];
document.querySelector('#menu').innerHTML=foods.map((f,i)=>`<div class="food"><span class="num">${i+1}</span><span class="emoji">${f.icon}</span><span>${f.zh}</span></div>`).join('');
document.querySelector('#balls').innerHTML=foods.map((f,i)=>`<span class="ball" style="background:${colors[i%colors.length]};--r:${(i%5-2)*12}deg">${f.icon}</span>`).join('');
const results=document.querySelector('#results'),button=document.querySelector('#draw'),machine=document.querySelector('#machine'),status=document.querySelector('#status');
function sampleThree(){const pool=[...foods];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}return pool.slice(0,3)}
function render(picks){results.innerHTML=picks.map((f,i)=>`<div class="result pop" style="animation-delay:${i*0.13}s"><span class="rank">${['🥇 第 1 名','🥈 第 2 名','🥉 第 3 名'][i]}</span><span class="icon">${f.icon}</span><strong>${f.zh}</strong><small class="en">${f.en}</small></div>`).join('')}
let last=[];function draw(){button.disabled=true;status.textContent='🎰 扭蛋轉動中…';machine.classList.remove('shake');void machine.offsetWidth;machine.classList.add('shake');results.innerHTML='<div class="result" style="grid-column:1/-1;min-height:170px;font-size:24px">✨ 正在抽出幸運美食…</div>';setTimeout(()=>{let picks=sampleThree();if(last.length){let attempts=0;while(picks.every((f,i)=>f.zh===last[i])&&attempts++<8)picks=sampleThree()}last=picks.map(f=>f.zh);render(picks);status.textContent='🎉 本次抽出的 3 名幸運美食！';button.disabled=false;machine.classList.remove('shake')},720)}
button.addEventListener('click',draw);render([foods[1],foods[4],foods[3]]);
</script>
</body></html>
